<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OKS Learning — Robotics Engineering Curriculum</title>
  <meta name="description" content="Personal study notes for OKS AMR robotics engineering: Zephyr, ROS 2, navigation estimation, electronics, and C++.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --base-font-size: 15px;
      --theme-color: #56b6c2;
      --sidebar-width: 280px;
      --sidebar-nav-link-color--active: #56b6c2;
      --sidebar-nav-link-border-color--active: #56b6c2;
      --cover-background-color: #0d1117;
    }
    .markdown-section h1 { border-bottom: 2px solid #56b6c2; padding-bottom: 0.3em; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section code { color: #e5c07b; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: '🤖 OKS Learning',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Search notes…',
        noData: 'No results.',
        depth: 3,
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied',
      },
      homepage: 'STUDY-PLAN.md',
      themeColor: '#56b6c2',
    };
  </script>
  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    window.$docsify.markdown = {
      renderer: {
        code(code, lang) {
          if (lang === 'mermaid') {
            return '<div class="mermaid">' + code + '</div>';
          }
          return this.origin.code.apply(this, arguments);
        },
      },
    };
    const observer = new MutationObserver(() => {
      document.querySelectorAll('.mermaid').forEach((el) => {
        if (!el.getAttribute('data-processed')) {
          mermaid.run({ nodes: [el] });
        }
      });
    });
    observer.observe(document.getElementById('app'), { childList: true, subtree: true });
  </script>
</body>
</html>
